# sfdx-hardis ENGINE config. Owns deploy, delta, test selection, packages, branch/org mapping.
# The human-facing policy overlay lives in ./.sf-devops.yml (approvers, sandbox type, seeding).
developmentBranch: integration     # feature branches fork off (and PR back into) integration

# Major branches, each mapped to an org in config/branches/.sfdx-hardis.<branch>.yml
majorBranches:
  - integration
  - uat
  - production

# Managed-package dependencies. Empty => nothing installed.
# Add with: sf hardis:package:install   (it appends here), or edit manually.
installedPackages: []

# Metadata auto-clean before deploy (reduces noisy diffs / merge pain).
autoCleanTypes:
  - destructivechanges
  - flowPositions
  - listViewsMine

# Apex test strategy for deploys (hardis selects impacted tests for delta by default).
testLevel: RunLocalTests

# Per-branch target orgs are defined in config/branches/.sfdx-hardis.<branch>.yml
# (integration, uat, production) — set targetUsername + instanceUrl there.
